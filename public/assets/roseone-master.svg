<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for App Icons & Favicon Tile -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1420" />
      <stop offset="50%" stop-color="#140E17" />
      <stop offset="100%" stop-color="#0B070D" />
    </linearGradient>

    <!-- Rose Gradient Primary -->
    <linearGradient id="rosePrimary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE185D" />
      <stop offset="45%" stop-color="#E91E8C" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Rose Gradient Secondary (Deeper petal shadow) -->
    <linearGradient id="roseDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D174D" />
      <stop offset="60%" stop-color="#BE185D" />
      <stop offset="100%" stop-color="#E91E8C" />
    </linearGradient>

    <!-- Accent Light Highlight -->
    <linearGradient id="roseHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="35%" stop-color="#FECDD3" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle glow aura -->
  <circle cx="256" cy="256" r="140" fill="#E91E8C" opacity="0.15" filter="url(#softGlow)" />

  <!-- RoseOne Mark Group: Unified "1" and Blooming Petal Monogram -->
  <g id="roseone-mark" transform="translate(256, 252)">
    <!-- Left outer curving petal envelope -->
    <path
      d="M -24,-136 C -80,-120 -134,-64 -134,18 C -134,88 -86,140 -12,148 C -2,149 6,143 6,133 C 6,118 -8,108 -20,102 C -72,78 -92,30 -78,-26 C -68,-66 -42,-104 -24,-136 Z"
      fill="url(#roseDark)"
    />

    <!-- Right sweeping rose petal creating the outer bloom -->
    <path
      d="M 16,-144 C 76,-136 134,-78 134,8 C 134,76 86,136 4,148 C 42,126 68,90 68,44 C 68,-22 36,-80 16,-144 Z"
      fill="url(#rosePrimary)"
    />

    <!-- Inner curving petal wrapping around the central 1 -->
    <path
      d="M -30,-60 C -10,-90 24,-94 52,-72 C 70,-58 76,-34 68,-10 C 60,14 36,36 6,48 C -2,51 -10,47 -10,38 C -10,18 8,-2 14,-22 C 18,-36 8,-50 -6,-54 C -16,-56 -24,-58 -30,-60 Z"
      fill="url(#roseHighlight)"
      opacity="0.95"
    />

    <!-- Central "1" pillar: Modern, crisp upright spine with dynamic angled apex -->
    <path
      d="M -18,-150 L 14,-150 C 18,-150 22,-147 24,-143 L 34,-120 C 37,-114 33,-106 25,-106 L 8,-106 L 8,138 C 8,145 2,150 -5,150 L -18,150 C -25,150 -31,145 -31,138 L -31,-106 L -42,-106 C -48,-106 -53,-112 -50,-118 L -38,-142 C -35,-147 -30,-150 -25,-150 Z"
      fill="#FFFFFF"
    />

    <!-- Accent Rose Sparkle / Petal Core on the "1" apex -->
    <circle cx="2" cy="-128" r="6" fill="#FB7185" />
  </g>
</svg>
